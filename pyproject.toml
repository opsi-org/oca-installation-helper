[project]
name = "oca-installation-helper"
version = "4.3.2.1"
readme = "README.md"
requires-python = ">=3.13"
description = "installer for opsi-client-agent packages"
dependencies = [
	"zeroconf==0.136.2",  # win7 compatibility
	"psutil==7.0.0",  # win7 compatibility
	"netifaces~=0.11",
	"python-opsi-common==4.3.28.2",  # win7 compatibility
	"textual~=0.81.0",
	"pydantic>=2.9,<2.11",  # win7 compatibility
	"pydantic-core>=2.20,<2.29",  # win7 compatibility
	"cryptography>=42.0.0,<43.0.0",  # win7 compatibility
	"pycryptodome==3.21.0",  # win7 compatibility
	"pyzsync>=1.2.6,<1.3",  # win7 compatibility
	"setuptools==76.0.0",  # win7 compatibility
	"packaging==24.2",  # win7 compatibility
	"rich==13.9.4",  # win7 compatibility
	"certifi==2025.1.31",  # win7 compatibility
	"iniconfig==2.0.0",  # win7 compatibility
	"lz4==4.4.3",  # win7 compatibility
	"urllib3==2.3.0",  # win7 compatibility
	"ruff==0.8.6",  # win7 compatibility
	"pytest",
	"pyinstaller",
	"pytest-cov==6.0.0",  # win7 compatibility
	"coverage==7.6.12",  # win7 compatibility
	"mypy",
	"mypy-extensions==1.0.0",  # win7 compatibility
	"typing-extensions==4.12.2",  # win7 compatibility
	"types-psutil==6.1.0.20241221",  # win7 compatibility
	"pytest-asyncio",
	"websocket-client@git+https://github.com/j-a-n/websocket-client.git@7022449697ac165a36269754930882188cb3ba93"
]
license = {text = "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)"}
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13"
]

[project.urls]
Homepage = "https://www.opsi.org"

[project.scripts]
oca-installation-helper = "ocainstallationhelper.__main__:main"

[[project.authors]]
name = "uib GmbH"
email = "info@uib.de"

[[project.maintainers]]
name = "uib GmbH"
email = "info@uib.de"

[tool.ruff]
line-length = 140

[tool.ruff.format]
indent-style = "tab"

[tool.uv]
extra-index-url = ["https://pypi.uib.gmbh/simple"]
index-strategy = "unsafe-best-match"
package = true

[tool.setuptools.packages.find]
include = ["ocainstallationhelper", "ocainstallationhelper.*"]