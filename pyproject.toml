[project]
name = "oca-installation-helper"
version = "4.3.2.1"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
	"zeroconf~=0.135",
	"psutil~=5.8",
	"netifaces~=0.11",
	"msgpack~=1.0",
	"python-opsi-common>=4.3,<4.4",
	"textual~=0.81.0",
	"pydantic>=2.9,<2.11",
	"pydantic-core>=2.20,<2.29",
	"cryptography>=42.0.0,<43.0.0",
	"ruff",
	"pytest",
	"pyinstaller",
	"pytest-cov",
	"mypy",
	"types-psutil",
	"pytest-asyncio",
]
license = {text = "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)"}

classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13"
]

[tool.ruff]
line-length = 140

[tool.ruff.format]
indent-style = "tab"

[tool.uv]
extra-index-url = ["https://pypi.uib.gmbh/simple"]
index-strategy = "unsafe-best-match"
package = true

[tool.setuptools.packages.find]
include = ["ocainstallationhelper", "ocainstallationhelper.*"]