image: docker.uib.gmbh/opsi/dev/pybuilder:deb9

stages:
  - test
  - build
  - viruscheck

test:pytest-macos-x64:
  stage: test
  tags:
    - catalina-x64
  script:
    - export UV_PYTHON="3.13-x86_64"
    - export UV_PYTHON_PREFERENCE="only-managed"
    - uv sync --frozen
    - uv run pytest --tb=short -o junit_family=xunit2 --junitxml=testreport.xml --cov-append --cov ocainstallationhelper --cov-report term --cov-report xml -v
    - mv .coverage coverage_darwin
  artifacts:
    name: "oca-installation-helper_test_darwin"
    paths:
      - testreport.xml
      - coverage_darwin
    expire_in: 3 days

test:pytest-windows-x86:
  stage: test
  tags:
    - win10-x64
  script:
    - $Env:UV_PYTHON_INSTALL_DIR = "c:\\uv\\python"
    - $Env:UV_CACHE_DIR = "c:\\uv\\cache"
    - $Env:UV_PYTHON = "3.13-x86"
    - $Env:UV_PYTHON_PREFERENCE = "only-managed"
    - $Env:RUSTUP_TOOLCHAIN = "stable-i686-pc-windows-msvc"
    - uv sync --frozen
    - uv run pytest --tb=short -o junit_family=xunit2 --junitxml=testreport.xml --cov-append --cov ocainstallationhelper --cov-report term --cov-report xml -v
    - Rename-Item -Path .coverage -NewName coverage_windows
  artifacts:
    name: "oca-installation-helper_test_windows"
    paths:
      - testreport.xml
      - coverage_windows
    expire_in: 3 days

test:pytest-linux-x64:
  stage: test
  tags:
    - docker-x64
  script:
    - export UV_PYTHON="3.13-x86_64"
    - export UV_PYTHON_PREFERENCE="only-managed"
    - uv self update
    - uv sync --frozen
    - uv run pytest --tb=short -o junit_family=xunit2 --junitxml=testreport.xml --cov-append --cov ocainstallationhelper --cov-report term --cov-report xml -v
    - mv .coverage coverage_linux
  artifacts:
    name: "oca-installation-helper_test_linux"
    paths:
      - testreport.xml
      - coverage_linux
    reports:
      junit: testreport.xml
    expire_in: 3 days

test:lint-and-test:
  stage: test
  tags:
    - docker-x64
  needs:
    # We want to combine test coverage from all test jobs
    - job: test:pytest-windows-x86
      artifacts: true
    - job: test:pytest-macos-x64
      artifacts: true
    - job: test:pytest-linux-x64
      artifacts: true
  script:
    - export UV_PYTHON="3.13-x86_64"
    - export UV_PYTHON_PREFERENCE="only-managed"
    - uv self update
    - uv sync --frozen
    - uv run ruff check ocainstallationhelper tests
    - uv run ty check ocainstallationhelper tests
    - opsi-dev-cli self upgrade
    - opsi-dev-cli -l info testing merge-coverage-files coverage_* .coverage
    - opsi-dev-cli -l info testing coverage-report
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+)%/'
  artifacts:
    name: "oca-installation-helper_test"
    paths:
      - coverage.xml
    expire_in: 3 days
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

build:pyinstaller-macos-x64:
  stage: build
  tags:
    - catalina-x64
  script:
    - export UV_PYTHON="3.13-x86_64"
    - export UV_PYTHON_PREFERENCE="only-managed"
    - curl -sS "${OPSIDEVTOOLS_INSTALLER_URL_MACOS_X64}" | sh
    - uv self update
    - uv sync --frozen
    - uv run opsi-dev-cli -l info pyinstaller build
    #- opsi-dev-cli -l6 apple sign-and-notarize --macho-fix --print-log dist/oca-installation-helper
    - ./dist/oca-installation-helper --version
    - '[ "$CI_COMMIT_TAG" = "" ] && opsi-dev-cli -l info binary push dist/oca-installation-helper --prerelease="$CI_JOB_ID"'
    - '[ "$CI_COMMIT_TAG" = "" ] || opsi-dev-cli -l info binary push dist/oca-installation-helper'

build:pyinstaller-linux-x64:
  stage: build
  tags:
    - docker-x64
  script:
    - export UV_PYTHON="3.13-x86_64"
    - export UV_PYTHON_PREFERENCE="only-managed"
    - curl -sS "${OPSIDEVTOOLS_INSTALLER_URL_LINUX_X64}" | sh
    - uv self update
    - uv sync --frozen
    - uv run opsi-dev-cli -l info pyinstaller build
    - ./dist/oca-installation-helper --version
    - '[ "$CI_COMMIT_TAG" = "" ] && opsi-dev-cli -l info binary push dist/oca-installation-helper --prerelease="$CI_JOB_ID"'
    - '[ "$CI_COMMIT_TAG" = "" ] || opsi-dev-cli -l info binary push dist/oca-installation-helper'

build:pyinstaller-linux-arm64:
  stage: build
  tags:
    - docker-arm64
  script:
    - export UV_PYTHON="3.13-aarch64"
    - export UV_PYTHON_PREFERENCE="only-managed"
    - curl -sS "${OPSIDEVTOOLS_INSTALLER_URL_LINUX_ARM64}" | sh
    - uv self update
    - uv sync --frozen
    - uv run opsi-dev-cli -l info pyinstaller build
    - ./dist/oca-installation-helper --version
    - '[ "$CI_COMMIT_TAG" = "" ] && opsi-dev-cli -l info binary push dist/oca-installation-helper --prerelease="$CI_JOB_ID"'
    - '[ "$CI_COMMIT_TAG" = "" ] || opsi-dev-cli -l info binary push dist/oca-installation-helper'

build:pyinstaller-windows-x86:
  stage: build
  tags:
    - win10-x64
  script:
    - $Env:UV_PYTHON_INSTALL_DIR = "c:\\uv\\python"
    - $Env:UV_CACHE_DIR = "c:\\uv\\cache"
    - $Env:UV_PYTHON = "3.13-x86"
    - $Env:UV_PYTHON_PREFERENCE = "only-managed"
    - $Env:RUSTUP_TOOLCHAIN = "stable-i686-pc-windows-msvc"
    - irm "${OPSIDEVTOOLS_INSTALLER_URL_WINDOWS_X86}" | iex
    - uv sync --frozen
    - uv run opsi-dev-cli -l info pyinstaller build
    - opsi-dev-cli -l info signserver sign dist\oca-installation-helper.exe
    # Check if binary is working
    # - dist\oca-installation-helper.exe --version  # this blocks until window is closed
    # Push to binaryindex
    - if (! $CI_COMMIT_TAG) {opsi-dev-cli -l info binary push dist\oca-installation-helper.exe --prerelease="$CI_JOB_ID"}
    - if ($CI_COMMIT_TAG) {opsi-dev-cli -l info binary push dist\oca-installation-helper.exe}
    - echo "Build finished successfully"
  artifacts:
    name: "windows_binary"
    paths:
      - dist\oca-installation-helper.exe

viruscheck:virustotal:
  stage: viruscheck
  tags:
    - docker-x64
  script:
    - opsi-dev-cli -l info --output-format simple virustotal check dist/oca-installation-helper.exe --allow-detections=8
  only:
    - tags
