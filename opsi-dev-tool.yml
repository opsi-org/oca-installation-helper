pyinstaller:
  one_file: yes
  scripts:
    - script: oca-installation-helper
      binaries:
        - oca-installation-helper
  dirname: ocainstallationhelper
  hidden_imports:
    all:
      - zeroconf._utils.ipaddress
      - zeroconf._handlers.answers
      - tkinter
  data_files:
    - src: opsi.ico
      dst: .
  icon:
    windows: opsi.ico
    linux: opsi.ico
    darwin: opsi.icns
  extra_args:
    windows:
      - --manifest
      - oca-installation-helper.manifest
      - --noconsole
